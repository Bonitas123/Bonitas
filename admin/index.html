<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin BONITAS</title><style>*{box-sizing:border-box;margin:0}body{font-family:Inter,Arial;display:flex;background:#fcf8f9}aside{width:230px;background:#1a0f14;color:#c49aa9;padding:22px;height:100vh;position:sticky;top:0}aside h2{color:#ff2e93;letter-spacing:4px;margin-bottom:28px}aside a{display:block;padding:12px;border-radius:10px;color:#c49aa9;text-decoration:none;margin:5px 0;cursor:pointer;font-size:14px}aside a.ativo{background:#2d1b24;color:white}main{flex:1;padding:26px}h1{font-size:26px;margin-bottom:14px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #f0d6de;border-radius:10px}.btn{background:#e84393;color:white;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.hide{display:none}</style></head><body><aside><h2>BONITAS</h2><a id="m-geral" class="ativo" onclick="page('geral')">Visão geral</a><a id="m-prod" onclick="page('prod')">Produtos</a><a id="m-ped" onclick="page('ped')">Pedidos</a><a id="m-cup" onclick="page('cup')">Cupons</a><a id="m-conf" onclick="page('conf')">Configurações</a><a href="/" style="margin-top:20px;background:#fff0f5;color:#e84393;text-align:center">Ver loja</a></aside><main><div id="p-geral"><p style="color:#e84393;font-size:10px;letter-spacing:2px">PAINEL ADMINISTRATIVO</p><div style="display:flex;justify-content:space-between;align-items:center"><h1>Visão geral</h1><a href="/" style="color:#e84393;text-decoration:none">Ver loja →</a></div><div class="grid4"><div class="card"><small>Produtos</small><h2 id="gv-p">0</h2></div><div class="card"><small>Estoque</small><h2 id="gv-e">0</h2></div><div class="card"><small>Pedidos novos</small><h2 id="gv-n">0</h2></div><div class="card"><small>Faturamento</small><h2 id="gv-f">R$ 0,00</h2></div></div><div id="recentes" class="card">Carregando pedidos...</div></div><div id="p-prod" class="hide"><h1>Produtos</h1><div class="card"><input id="np-nome" placeholder="Nome do produto"><input id="np-preco" placeholder="Preço ex: 59.90" type="number"><input id="np-foto" placeholder="Link da foto"><button class="btn" onclick="addProd()">Adicionar produto</button></div><div id="listaProd" class="card"></div></div><div id="p-ped" class="hide"><h1>Pedidos</h1><div id="listaPed" class="card">Carregando...</div></div><div id="p-cup" class="hide"><h1>Cupons</h1><div class="card"><input placeholder="Código ex: BONITAS10"><select><option>Desconto %</option><option>Frete grátis</option></select><input placeholder="Valor"><button class="btn">Criar cupom</button></div></div><div id="p-conf" class="hide"><h1>Configurações</h1><div class="card"><label>WhatsApp da loja (você escolhe)</label><input id="c-zap" value="558399923260"><label>Taxa de entrega padrão</label><input id="c-taxa" value="10.00"><label>Chave PIX (você escolhe)</label><input id="c-pix" value="66b5d5fe-b9af-4d26-9f27-2467300dc6e3"><label>Instagram</label><input id="c-insta" value="@bonitas_storemodafeminina"><button class="btn" style="width:100%;margin-top:10px" onclick="salvarConf()">SALVAR CONFIGURAÇÕES</button></div></div></main><script>let prods=[];function page(p){document.querySelectorAll('main>div').forEach(d=>d.classList.add('hide'));document.getElementById('p-'+p).classList.remove('hide');document.querySelectorAll('aside a').forEach(a=>a.classList.remove('ativo'));document.getElementById('m-'+p).classList.add('ativo');if(p=='ped'||p=='geral')carregarPedidos();if(p=='prod')renderProd();}async function carregarPedidos(){const r=await fetch('/api/todos-pedidos');const j=await r.json();let h='';let total=0;let qtd=0;if(Object.keys(j).length==0)h='Nenhum pedido ainda';else for(let k in j){let x=j[k];total+=Number(x.total||0);qtd++;h+=`<div style="padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><div><b>${k}</b> - ${x.nome||'Cliente'} - R$${x.total}<br><small>${x.produtos||''} - ${x.pagamento}</small></div><div><button class="btn" onclick="mudar('${k}','Pago')">PAGO</button> <button class="btn" style="background:#999" onclick="mudar('${k}','Falta pagar')">FALTA</button></div></div>`}document.getElementById('recentes').innerHTML=h;document.getElementById('listaPed').innerHTML=h;document.getElementById('gv-n').innerText=qtd;document.getElementById('gv-f').innerText='R$ '+total.toFixed(2);}async function mudar(c,s){await fetch('/api/pedido/pagamento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:c,pagamento:s})});carregarPedidos();}function salvarConf(){localStorage.setItem('bonitas_conf',JSON.stringify({zap:document.getElementById('c-zap').value,taxa:document.getElementById('c-taxa').value,pix:document.getElementById('c-pix').value,insta:document.getElementById('c-insta').value}));alert('Salvo! Agora você escolhe Zap, Taxa e PIX!');}function addProd(){const n=document.getElementById('np-nome').value,p=document.getElementById('np-preco').value,f=document.getElementById('np-foto').value;if(!n||!p)return alert('Nome e preço');let lista=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');lista.push({nome:n,preco:p,foto:f,cat:'BONITAS'});localStorage.setItem('bonitas_produtos',JSON.stringify(lista));alert('Produto adicionado! Vai aparecer na loja #loja');renderProd();}function renderProd(){let lista=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');document.getElementById('gv-p').innerText=lista.length;document.getElementById('gv-e').innerText=lista.length*10;document.getElementById('listaProd').innerHTML=lista.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>${x.nome} - R$${x.preco}</span><span style="cursor:pointer" onclick="let l=JSON.parse(localStorage.getItem('bonitas_produtos'));l.splice(${i},1);localStorage.setItem('bonitas_produtos',JSON.stringify(l));renderProd()">🗑️</span></div>`).join('')||'Nenhum produto cadastrado';}renderProd();carregarPedidos();</script></body></html>
