<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin BONITAS 09282326</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;font-family:Inter}body{background:#fdf2f5;display:flex}#login{position:fixed;inset:0;background:#120a0e;z-index:9999;display:flex;align-items:center;justify-content:center}#login div{background:white;padding:28px;border-radius:18px;width:90%;max-width:360px;text-align:center}aside{width:240px;background:#1a0f14;min-height:100vh;padding:20px;position:sticky;top:0}aside h2{color:#ff3a93;letter-spacing:4px;font-family:Playfair Display}aside a{display:block;color:#d9a9bb;padding:11px 12px;border-radius:10px;margin:6px 0;cursor:pointer;text-decoration:none}aside a.ativo{background:#2e1d26;color:#fff}main{flex:1;padding:24px;max-width:1000px}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 12px #0001;margin-bottom:16px}input,textarea,select{width:100%;padding:11px;border:1px solid #f0d6de;border-radius:10px;margin:6px 0}label{font-size:13px;color:#555;margin-top:8px;display:block}.btn{background:#e84393;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.estoque{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hide{display:none}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}.ok{background:#d1fae5;color:#065f46}.pend{background:#fef3c7;color:#92400e}</style>
</head><body>
<div id="login"><div><h2 style="color:#e84393;letter-spacing:4px;font-family:Playfair Display">BONITAS</h2><p style="margin:8px 0">Senha 09282326</p><input id="senha" type="password" placeholder="Senha"><button class="btn" style="margin-top:10px" onclick="entrar()">ENTRAR</button><p id="erro" style="color:red;display:none;margin-top:8px">Senha errada</p></div></div>
<aside><h2>BONITAS</h2><a id="m-geral" class="ativo" onclick="page('geral')">Visão geral</a><a id="m-prod" onclick="page('prod')">Produtos</a><a id="m-ped" onclick="page('ped')">Pedidos</a><a id="m-cup" onclick="page('cup')">Cupons</a><a id="m-conf" onclick="page('conf')">Configurações</a><a onclick="sessionStorage.clear();location.reload()" style="background:#ff2e93;color:#fff;text-align:center">Sair</a><a href="../" style="background:#fff;color:#e84393;text-align:center">Ver loja</a></aside>
<main>
<div id="p-geral"><small style="color:#e84393;letter-spacing:3px">PAINEL ADMINISTRATIVO</small><h1 style="font-family:Playfair Display">Visão geral</h1><div class="grid2"><div class="card"><h3>Produtos cadastrados</h3><h1 id="g-prod">0</h1></div><div class="card"><h3>Pedidos recentes</h3><h1 id="g-ped">0</h1></div></div><div id="g-lista" class="card"></div></div>

<div id="p-prod" class="hide"><h1>Produtos</h1><div class="card"><h3>Novo produto</h3><div class="grid2"><div><label>Nome *</label><input id="n-nome"></div><div><label>Categoria *</label><input id="n-cat" placeholder="Croppeds"></div></div><div class="grid2"><div><label>Preço (R$) *</label><input id="n-preco" type="number"></div><div><label>Preço antigo</label><input id="n-ant" type="number"></div></div><label>Descrição</label><textarea id="n-desc"></textarea><label>Cores, separadas por vírgula *</label><input id="n-cores" value="Rosa, Branco" oninput="gerar()"><label>URLs de imagens, uma por linha</label><textarea id="n-urls" placeholder="https://..."></textarea><label>Enviar fotos (JPG, PNG, WebP até 5MB)</label><input type="file" id="n-file" multiple accept="image/*"><div style="margin:10px 0"><label style="display:inline"><input type="checkbox" id="n-dest"> Destaque</label><label style="display:inline;margin-left:12px"><input type="checkbox" id="n-nov"> Novidade</label><label style="display:inline;margin-left:12px"><input type="checkbox" id="n-ativo" checked> Ativo</label></div><h3>Estoque por tamanho e cor</h3><div id="boxEst" class="estoque"></div><button class="btn" style="background:#111;margin-top:12px" onclick="salvarProd()">Salvar produto</button></div><div id="listaProd" class="card"></div></div>

<div id="p-ped" class="hide"><h1>Pedidos</h1><div id="listaPed" class="card"></div></div>
<div id="p-cup" class="hide"><h1>Cupons</h1><div class="card"><label>Código</label><input placeholder="BONITAS10"><label>Desconto %</label><input type="number" value="10"><button class="btn" style="margin-top:10px">Criar cupom</button></div></div>
<div id="p-conf" class="hide"><small style="color:#e84393;letter-spacing:3px">PAINEL</small><h1>Configurações</h1><div class="card"><label>Nome da loja</label><input value="BONITAS"><label>WhatsApp com DDI</label><input id="c-zap" value="558399923260"><label>Instagram</label><input value="@bonitas_storemodafeminina"><label>Endereço</label><input value="Joao Pessoa - PB"><label style="color:#e84393;font-weight:700">Taxa de entrega (R$) - AJUSTE AQUI</label><input id="c-taxa" value="10.00"><label>Limite estoque baixo</label><input value="3"><label>Horário</label><input value="Segunda a sábado, 9h às 18h"><label>Pedido mínimo</label><input value="0.00"><h3 style="margin-top:16px">PIX da loja</h3><label>Chave PIX</label><input value="66b5d5fe-b9af-4d26-9f27-2467300dc6e3"><label>Nome recebedor</label><input value="BONITAS"><label>Cidade</label><input value="JOAO PESSOA"><button class="btn" style="margin-top:14px" onclick="salvarConf()">SALVAR CONFIGURAÇÕES</button></div></div>
</main>
<script>
const SENHA='09282326';
function check(){if(sessionStorage.getItem('log')!='1'){document.getElementById('login').style.display='flex'}else{document.getElementById('login').style.display='none';atualizaGeral()}}
function entrar(){if(document.getElementById('senha').value===(localStorage.getItem('bonitas_senha')||SENHA)){sessionStorage.setItem('log','1');check()}else{document.getElementById('erro').style.display='block'}}check();
function page(p){['geral','prod','ped','cup','conf'].forEach(x=>{document.getElementById('p-'+x).classList.add('hide');document.getElementById('m-'+x).classList.remove('ativo')});document.getElementById('p-'+p).classList.remove('hide');document.getElementById('m-'+p).classList.add('ativo');if(p==='geral')atualizaGeral();if(p==='ped')carregaPed();if(p==='prod')listaP()}
function atualizaGeral(){let prods=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');let peds=JSON.parse(localStorage.getItem('bonitas_pedidos')||'[]');document.getElementById('g-prod').innerText=prods.length;document.getElementById('g-ped').innerText=peds.length;document.getElementById('g-lista').innerHTML=peds.slice(-5).reverse().map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${x.itens} - R$ ${x.total}</span><span class="badge ${x.pago?'ok':'pend'}">${x.pago?'PAGO':'PENDENTE'}</span></div>`).join('')||'Nenhum pedido ainda'}
function gerar(){let cores=document.getElementById('n-cores').value.split(',').map(s=>s.trim()).filter(Boolean);let tams=['PP','P','M','G','GG'];let b=document.getElementById('boxEst');b.innerHTML='';cores.forEach(c=>{tams.forEach(t=>{b.innerHTML+=`<div><label>${t}/${c}</label><input type="number" data-e="${t}/${c}" value="0"></div>`})})}gerar();
function salvarProd(){
 let nome=document.getElementById('n-nome').value;if(!nome) return alert('Nome obrigatório');
 let foto=document.getElementById('n-urls').value.split('\n')[0]||'https://images.unsplash.com/photo-1550928431-ee0ec6db30d3?w=500';
 let estoque={};document.querySelectorAll('[data-e]').forEach(i=>estoque[i.dataset.e]=Number(i.value));
 let p={nome,cat:document.getElementById('n-cat').value,preco:document.getElementById('n-preco').value||0,antigo:document.getElementById('n-ant').value,desc:document.getElementById('n-desc').value,cores:document.getElementById('n-cores').value,tam:'P',foto,estoque,ativo:document.getElementById('n-ativo').checked,promo:document.getElementById('n-dest').checked};
 let lista=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');lista.push(p);localStorage.setItem('bonitas_produtos',JSON.stringify(lista));alert('Produto salvo!');listaP();atualizaGeral();
}
function listaP(){let lista=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');document.getElementById('listaProd').innerHTML=lista.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${p.nome} - R$ ${p.preco}</span><button onclick="rem(${i})" style="color:red;background:none;border:none;cursor:pointer">Excluir</button></div>`).join('')||'Nenhum produto'}
function rem(i){let l=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');l.splice(i,1);localStorage.setItem('bonitas_produtos',JSON.stringify(l));listaP();atualizaGeral()}
function carregaPed(){let peds=JSON.parse(localStorage.getItem('bonitas_pedidos')||'[]');let d=document.getElementById('listaPed');if(!peds.length){d.innerHTML='Nenhum pedido ainda. Quando cliente comprar, aparece aqui!';return}d.innerHTML=peds.reverse().map((p,i)=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${p.itens}</b><br>Total: R$ ${p.total} (Entrega R$ ${p.taxa||10}) - ${p.data}<br><span class="badge ${p.pago?'ok':'pend'}">${p.pago?'PAGO':'PENDENTE'}</span> <button onclick="pago(${peds.length-1-i})" style="margin-left:8px;padding:4px 8px;border-radius:6px;border:none;background:#111;color:#fff;cursor:pointer">Marcar PAGO</button></div>`).join('')}
function pago(i){let l=JSON.parse(localStorage.getItem('bonitas_pedidos')||'[]');l[i].pago=true;localStorage.setItem('bonitas_pedidos',JSON.stringify(l));carregaPed()}
function salvarConf(){let c={zap:document.getElementById('c-zap').value,taxa:document.getElementById('c-taxa').value};localStorage.setItem('bonitas_conf',JSON.stringify(c));alert('✅ Configuração salva! Taxa entrega: R$ '+c.taxa)}
</script>
</body></html>
