
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BONITAS | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;font-family:Inter}
body{background:#fff8fb;display:flex;min-height:100vh}
#login{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:url('https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1400') center/cover}
#login::after{content:'';position:absolute;inset:0;background:rgba(255,245,247,.65);backdrop-filter:blur(12px)}
#loginBox{position:relative;z-index:2;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:32px;border-radius:24px;width:100%;max-width:380px;box-shadow:0 20px 60px #0002, inset 0 1px 0 rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.8);text-align:center}
#loginBox input{width:100%;padding:12px;border:1px solid #f0c6d3;border-radius:12px;margin-top:8px;background:rgba(255,255,255,.8)}
aside{width:250px;background:#1c1218;min-height:100vh;padding:20px;position:sticky;top:0;display:flex;flex-direction:column;justify-content:space-between}
aside h2{color:#ff5eb0;letter-spacing:5px;font-family:Playfair Display}
aside nav a{display:block;color:#c49fb0;padding:11px 12px;border-radius:10px;margin:5px 0;text-decoration:none;cursor:pointer}
aside nav a.ativo{background:#2d1e27;color:#fff;font-weight:700}
main{flex:1;padding:28px;background:#fff8fb}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.formCard{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:700px;max-height:90vh;overflow:auto}
label{font-size:11px;color:#666;display:block;margin-top:14px;text-transform:uppercase;font-weight:600}
input,textarea,select{width:100%;padding:12px;border:1px solid #e5c3ce;border-radius:12px;margin-top:6px;background:#fff9fb}
.btnPink{background:#e84393;color:#fff;border:none;padding:12px 22px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:16px}
.btnDark{background:#111;color:#fff;border:none;padding:11px 20px;border-radius:10px;font-weight:700;cursor:pointer}
.btnGhost{background:none;border:none;padding:10px;cursor:pointer;color:#666}
.hide{display:none}
.card{background:#fff;border:1px solid #f6e1e8;border-radius:16px;padding:22px;margin-top:16px}
.estoqueGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.catTag{background:#ffe2ea;color:#e84393;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;margin:5px}
</style></head><body>
<div id="login"><div id="loginBox">
<p style="color:#e84393;letter-spacing:3px;font-size:11px;font-weight:700">PAINEL ADMINISTRATIVO</p>
<h1 style="font-family:Playfair Display;font-size:26px">Bem-vinda</h1>
<div style="text-align:left;margin-top:14px"><label>E-mail</label><input id="email" value="admin@gmail.com"></div>
<div style="text-align:left"><label>Senha</label><input id="senha" type="password" placeholder="••••••••"></div>
<button onclick="entrar()" style="background:#e84393;color:#fff;border:none;padding:13px;border-radius:12px;width:100%;font-weight:700;margin-top:14px">ENTRAR NO PAINEL</button>
<p id="erro" style="color:#e84393;display:none;margin-top:8px">Senha incorreta!</p>
</div></div>
<aside><div><h2>BONITAS</h2><nav style="margin-top:24px">
<a id="m-geral" onclick="showPage('geral')">🏠 Visão geral</a>
<a id="m-prod" class="ativo" onclick="showPage('prod')">👚 Produtos</a>
<a id="m-cat" onclick="showPage('cat')">📂 Categorias</a>
<a id="m-conf" onclick="showPage('conf')">⚙️ Configurações</a>
</nav></div><a onclick="localStorage.removeItem('bonitas_log');location.reload()" style="color:#8a6a78;font-size:13px;cursor:pointer">↩ Sair</a></aside>
<main>
<div id="p-geral" class="hide"><h1 style="font-family:Playfair Display">Visão geral</h1><div class="card">Total: R$ 0,00</div></div>
<div id="p-prod"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-family:Playfair Display">Produtos</h1><button class="btnDark" onclick="abrirModalProd()">+ Novo produto</button></div><div id="listaProd" class="card">Nenhum produto</div></div>
<div id="p-cat" class="hide">
<h1 style="font-family:Playfair Display;font-size:32px">Categorias</h1>
<div class="card"><h3>Criar nova categoria</h3><div style="display:flex;gap:10px;margin-top:10px"><input id="novaCatNome" placeholder="Ex: Blusas, Calças, Saias"><button class="btnDark" onclick="salvarCategoria()">+ Criar</button></div></div>
<div class="card"><h3>Categorias criadas</h3><div id="listaCat" style="margin-top:12px"></div></div>
</div>
<div id="p-conf" class="hide"><h1>Configurações</h1><div class="card"><label>WhatsApp</label><input id="c-zap" value="558399923260"><label>Taxa entrega</label><input id="c-taxa" value="10.00"><label>Chave PIX</label><input id="c-pix" value="66b5d5fe-b9af-4d26-9f27-2467300dc6e3"><button class="btnPink" onclick="salvarConf()">SALVAR CONFIG</button></div></div>
</main>
<div id="modalProd" class="modal hide"><div class="formCard">
<h2>Novo produto</h2>
<label>Nome *</label><input id="n-nome">
<label>Categoria *</label><select id="n-cat"></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Preço *</label><input id="n-preco" type="number"></div><div><label>Preço antigo</label><input id="n-precoAnt"></div></div>
<label>Cores (Rosa, Branco)</label><input id="n-cores" value="Rosa, Branco">
<label>URL da imagem (cole link)</label><textarea id="n-urls" placeholder="https://..."></textarea>
<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btnGhost" onclick="fecharModalProd()">Cancelar</button><button class="btnPink" style="width:auto" onclick="salvarProdutoFinal()">SALVAR PRODUTO</button></div>
</div></div>
<script>
const SENHA='09282326';
function getCategorias(){return JSON.parse(localStorage.getItem('bonitas_categorias')||'[]')}
function salvarCategoria(){let nome=document.getElementById('novaCatNome').value.trim();if(!nome)return alert('Digite nome');let cats=getCategorias();if(cats.includes(nome))return alert('Já existe');cats.push(nome);localStorage.setItem('bonitas_categorias',JSON.stringify(cats));document.getElementById('novaCatNome').value='';listarCategorias();alert('✅ '+nome+' criada!');}
function remCat(i){if(!confirm('Excluir?'))return;let cats=getCategorias();cats.splice(i,1);localStorage.setItem('bonitas_categorias',JSON.stringify(cats));listarCategorias();}
function listarCategorias(){let cats=getCategorias();document.getElementById('listaCat').innerHTML=cats.length?cats.map((c,i)=>`<span class="catTag">${c} <button onclick="remCat(${i})" style="background:none;border:none;color:#e84393;font-weight:700;cursor:pointer">✕</button></span>`).join(''):'Nenhuma categoria ainda.';let sel=document.getElementById('n-cat');sel.innerHTML=cats.length?cats.map(c=>`<option>${c}</option>`).join(''):'<option>Crie categoria primeiro</option>';}
function checkLogin(){if(localStorage.getItem('bonitas_log')==='1')document.getElementById('login').style.display='none'}
function entrar(){if(document.getElementById('senha').value===SENHA){localStorage.setItem('bonitas_log','1');document.getElementById('login').style.display='none';showPage('prod')}else document.getElementById('erro').style.display='block'}
checkLogin();
function showPage(p){['geral','prod','cat','conf'].forEach(x=>{document.getElementById('p-'+x).classList.add('hide');document.getElementById('m-'+x).classList.remove('ativo')});document.getElementById('p-'+p).classList.remove('hide');document.getElementById('m-'+p).classList.add('ativo');if(p==='cat')listarCategorias();if(p==='prod')listarProdutos();}
function abrirModalProd(){listarCategorias();if(!getCategorias().length){alert('Crie uma categoria primeiro!');showPage('cat');return}document.getElementById('modalProd').classList.remove('hide')}
function fecharModalProd(){document.getElementById('modalProd').classList.add('hide')}
function salvarProdutoFinal(){let nome=document.getElementById('n-nome').value;if(!nome)return alert('Nome');let cat=document.getElementById('n-cat').value;let foto=document.getElementById('n-urls').value.split('\n')[0]||'https://via.placeholder.com/400x500?text=BONITAS';let prod={id:Date.now(),nome,cat,preco:document.getElementById('n-preco').value||59.9,foto,cores:document.getElementById('n-cores').value};let l=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');l.push(prod);localStorage.setItem('bonitas_produtos',JSON.stringify(l));alert('✅ Salvo!');fecharModalProd();listarProdutos();}
function listarProdutos(){let l=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');document.getElementById('listaProd').innerHTML=l.length?l.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span><img src="${p.foto}" style="width:40px;height:40px;border-radius:8px;margin-right:8px"><b>${p.nome}</b> <small>${p.cat}</small></span><button onclick="let a=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');a.splice(${i},1);localStorage.setItem('bonitas_produtos',JSON.stringify(a));listarProdutos()" style="color:red;background:none;border:none">Excluir</button></div>`).join(''):'Nenhum produto - crie o primeiro!'}
function salvarConf(){let c={zap:document.getElementById('c-zap').value,taxa:document.getElementById('c-taxa').value,pix:document.getElementById('c-pix').value};localStorage.setItem('bonitas_conf',JSON.stringify(c));alert('Config salva!');}
showPage('prod');listarCategorias();listarProdutos();
</script></body></html>
