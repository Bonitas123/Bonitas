<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin BONITAS</title>
<style>
body{font-family:Arial;background:#f8f8f8;padding:15px}
.pedido{background:white;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>
<body>
<h2 style="color:#ff4d6d">BONITAS - Pedidos</h2>
<button onclick="carregar()">🔄 Atualizar</button>
<div id="lista">Carregando...</div>
<script>
async function carregar(){
  const res = await fetch('/api/todos-pedidos');
  const pedidos = await res.json();
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  for(let codigo in pedidos){
    let p = pedidos[codigo];
    lista.innerHTML += `<div class="pedido"><b>${codigo}</b> - ${p.nome}<br>${p.blusa||''}<br>${p.endereco||''}<br>R$ ${p.total||''}</div>`;
  }
  if(Object.keys(pedidos).length==0) lista.innerHTML='Nenhum pedido';
}
carregar();
</script>
</body>
</html>
