<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin BONITAS</title>
<style>body{font-family:Arial;background:#f8f3f7;padding:20px} .box{background:#fff;padding:16px;border-radius:12px;margin:12px 0;border:1px solid #eee} input,select{width:100%;padding:10px;margin:4px 0;border:1px solid #ddd;border-radius:8px} button{background:#FF2DA0;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} table{width:100%;border-collapse:collapse;font-size:13px} td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}</style>
</head><body>
<div id="login" style="max-width:360px;margin:80px auto;text-align:center;background:#fff;padding:24px;border-radius:16px"><h2>🔒 Admin BONITAS</h2><p>Senha:</p><input id="senha" type="password" placeholder="09282326"><button onclick="logar()" style="width:100%;margin-top:10px">ENTRAR</button></div>
<div id="painel" style="display:none">
<h1>BONITAS - Painel Administrativo</h1><button onclick="location.href='../'">← Voltar pra loja</button>
<div class="grid">
<div class="box"><h3>➕ Cadastrar Produto</h3><input id="pNome" placeholder="Nome ex: Blusa Rosa"><input id="pPreco" type="number" placeholder="Preço ex: 49.90"><input id="pCat" placeholder="Categoria ex: Blusa"><input id="pImg" placeholder="Link da imagem (ou deixe vazio)"><button onclick="addProd()">Cadastrar</button></div>
<div class="box"><h3>🏷️ Cupom</h3><input id="cCod" placeholder="Código ex: BONITAS10"><input id="cVal" type="number" placeholder="% desconto ex: 10"><button onclick="addCupom()">Criar Cupom</button><div id="listaCupom" style="margin-top:8px"></div></div>
</div>
<div class="box"><h3>📦 Produtos Cadastrados (<span id="qtdP">0</span>)</h3><div id="listaProd"></div></div>
<div class="box"><h3>🧾 Pedidos - Códigos</h3><div id="listaPed"></div></div>
</div>
<script>
function logar(){if(document.getElementById('senha').value==='09282326'){document.getElementById('login').style.display='none';document.getElementById('painel').style.display='block';render()}else alert('Senha errada')}
let prods=JSON.parse(localStorage.getItem('bonitas_prod')||'[]');
let cupons=JSON.parse(localStorage.getItem('bonitas_cupons')||'[{"codigo":"BONITAS10","valor":10}]');
function addProd(){let nome=document.getElementById('pNome').value;let preco=parseFloat(document.getElementById('pPreco').value);let cat=document.getElementById('pCat').value;let img=document.getElementById('pImg').value||'https://via.placeholder.com/300x400/FF2DA0/fff?text='+encodeURIComponent(nome);if(!nome||!preco){alert('Nome e preço');return}prods.push({nome,preco,cat,img});localStorage.setItem('bonitas_prod',JSON.stringify(prods));alert('Cadastrado!');render();document.getElementById('pNome').value=''}
function addCupom(){let codigo=document.getElementById('cCod').value.toUpperCase();let valor=parseFloat(document.getElementById('cVal').value);if(!codigo||!valor)return;cupons.push({codigo,valor});localStorage.setItem('bonitas_cupons',JSON.stringify(cupons));render()}
function render(){
document.getElementById('qtdP').innerText=prods.length;
document.getElementById('listaProd').innerHTML=prods.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>${p.nome} - R$ ${p.preco} - ${p.cat}</span><span style="color:red;cursor:pointer" onclick="delProd(${i})">Excluir</span></div>`).join('')||'Nenhum produto - cadastre acima';
document.getElementById('listaCupom').innerHTML=cupons.map((c,i)=>`<div>${c.codigo} - ${c.valor}% <span style="color:red;cursor:pointer" onclick="delCupom(${i})">x</span></div>`).join('');
let pedidos=JSON.parse(localStorage.getItem('bonitas_ped')||'[]');
document.getElementById('listaPed').innerHTML=pedidos.length==0?'Nenhum pedido ainda':`<table><tr><th>Código</th><th>Cliente</th><th>Total</th><th>Data</th></tr>${pedidos.map(p=>`<tr><td>${p.codigo}</td><td>${p.nome}</td><td>R$ ${p.total.toFixed(2)}</td><td>${p.data}</td></tr>`).join('')}</table>`;
}
function delProd(i){prods.splice(i,1);localStorage.setItem('bonitas_prod',JSON.stringify(prods));render()}
function delCupom(i){cupons.splice(i,1);localStorage.setItem('bonitas_cupons',JSON.stringify(cupons));render()}
if(localStorage.getItem('bonitas_admin_log')==='1'){document.getElementById('login').style.display='none';document.getElementById('painel').style.display='block';render()}
</script></body></html>
