<style>
*{box-sizing:border-box;margin:0;font-family:Inter}body{background:#fff5f7}

#carrinhoModal.aberto{transform:translateX(0)}
.meio{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.payOpt{border:1.5px solid #f0c6d3;padding:12px;border-radius:12px;margin:6px 0;display:flex;justify-content:space-between;cursor:pointer}
.payOpt.ativo{border-color:#e84393;background:#fff0f5}
.footerFixo{flex-shrink:0;background:#fff;border-top:3px solid #e84393;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px #0001}
#cartBtn{position:fixed;right:12px;bottom:12px;background:#111;color:#fff;padding:12px 20px;border-radius:30px;z-index:60;font-weight:800}
@media(max-width:800px){#grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}
</style>

</div>
