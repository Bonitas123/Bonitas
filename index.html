<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BONITAS | Feito para você</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;font-family:Inter}
body{background:#fff5f7}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#fff;position:sticky;top:0;z-index:99;box-shadow:0 2px 10px #0001}
header b{font-family:Playfair Display;color:#8a1740;letter-spacing:2px;font-size:26px}
.hero{padding:40px 24px;text-align:center;background:linear-gradient(#fff5f7,#fff)}
.hero h1{font-family:Playfair Display;font-size:48px;color:#8a1740}.hero small{letter-spacing:4px;color:#d68aa6}
.buscaWrap{max-width:500px;margin:18px auto;background:#fff;border:1px solid #f0c6d3;border-radius:30px;display:flex;align-items:center;padding:6px}
.buscaWrap input{flex:1;border:none;outline:none;padding:10px 14px;border-radius:30px}
.buscaWrap button{background:#e98aaa;color:#fff;border:none;padding:8px 20px;border-radius:20px;font-weight:700;cursor:pointer}
.layout{max-width:1250px;margin:0 auto;padding:20px;display:grid;grid-template-columns:260px 1fr;gap:20px}
.filtros{background:#fff;border-radius:16px;padding:18px;border:1px solid #f5d6e0;position:sticky;top:80px;height:fit-content}
.tam{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tam button{padding:8px;border:1px solid #f0c6d3;background:#f9f0f3;border-radius:10px;cursor:pointer}
.tam button.ativo{background:#fde2ea;border-color:#e84393;color:#8a1740;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #f3d6e0;box-shadow:0 4px 12px #0001}
.card img{width:100%;height:280px;object-fit:cover;background:#ffeef3}
.card.info{padding:12px;display:flex;justify-content:space-between;align-items:center}
.preco{color:#8a1740;font-weight:700}
.add{background:#e98aaa;color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.vazio{grid-column:1/-1;text-align:center;padding:80px 20px;background:#fff;border-radius:16px;border:1px dashed #e98aaa;color:#999}
#cartBtn{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:14px 22px;border-radius:30px;font-weight:700;cursor:pointer;z-index:98}
#carrinhoModal{position:fixed;right:0;top:0;width:390px;max-width:100vw;height:100vh;background:#fff;box-shadow:-10px 0 30px #0003;z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:.3s}
#carrinhoModal.aberto{transform:translateX(0)}
.carrinhoItem{display:flex;gap:12px;padding:16px;border-bottom:1px solid #f5f5f5;align-items:center}
.carrinhoItem img{width:66px;height:66px;border-radius:12px;object-fit:cover}
.qtdBtn{border:1px solid #eee;background:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer}
.payOpt{border:1.5px solid #f0c6d3;padding:12px;border-radius:12px;margin:6px 0;cursor:pointer;display:flex;justify-content:space-between}
.payOpt.ativo{border-color:#e84393;background:#fff5f7}
@media(max-width:900px){.layout{grid-template-columns:1fr}#grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<header><b>BONITAS</b><div onclick="abrirCarrinho()" style="cursor:pointer">🛒 <span id="qtd">0</span></div></header>

<div class="hero"><h1>Nossa loja</h1><small>FEITO PARA VOCÊ</small>
<div class="buscaWrap"><input id="busca" placeholder="Buscar produtos..." oninput="render()"><button onclick="render()">Buscar</button></div></div>

<div class="layout">
<div class="filtros">
<b style="font-size:13px">Categoria</b><div id="filtroCats"></div>
<b style="font-size:13px;display:block;margin-top:14px">Preço máximo</b><span id="pmaxTxt" style="color:#e84393;font-weight:700">R$ 300</span><input type="range" id="pmax" min="0" max="300" value="300" style="width:100%" oninput="document.getElementById('pmaxTxt').innerText='R$ '+this.value;render()">
<b style="font-size:13px;display:block;margin-top:14px">Tamanho</b><div class="tam"><button onclick="setTam(this,'PP')">PP</button><button onclick="setTam(this,'P')" class="ativo">P</button><button onclick="setTam(this,'M')">M</button><button onclick="setTam(this,'G')">G</button><button onclick="setTam(this,'GG')">GG</button></div>
<button style="width:100%;margin-top:16px;background:#e98aaa;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer" onclick="render()">Aplicar filtros</button>
</div>
<div id="grid"></div>
</div>

<!-- CARRINHO IGUAL SUA FOTO + PAGAMENTOS -->
<div id="carrinhoModal">
<div style="padding:22px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><h2>Seu carrinho</h2><button onclick="fecharCarrinho()" style="background:none;border:none;font-size:20px;cursor:pointer">✕</button></div>
<div id="itensCarrinho" style="flex:1;overflow:auto"></div>
<div style="padding:20px;border-top:1px solid #eee">
<div id="pagamentos" style="display:none">
<h4>Forma de pagamento</h4>
<div class="payOpt" onclick="selPay(this,'dinheiro')"><span>💵 Dinheiro</span><small>Whats</small></div>
<div class="payOpt" onclick="selPay(this,'credito')"><span>💳 Crédito</span><small>3x sem juros</small></div>
<div class="payOpt" onclick="selPay(this,'debito')"><span>💳 Débito</span><small>À vista</small></div>
<div class="payOpt" onclick="selPay(this,'pix')"><span>🔷 PIX</span><small>QR Code</small></div>
<div id="pixArea" style="display:none;text-align:center;margin-top:12px;background:#f9f9f9;padding:12px;border-radius:12px"><img id="pixQr" style="width:180px;height:180px"><p style="font-size:11px;word-break:break-all;margin-top:8px">Chave: <span id="pixChaveTxt"></span></p><p style="font-weight:700;margin-top:6px" id="pixTotal"></p></div>
<div id="parcelaInfo" style="display:none;margin-top:10px;background:#fff5f7;padding:10px;border-radius:10px;text-align:center;font-size:13px"></div>
</div>
<div style="display:flex;justify-content:space-between;margin:14px 0"><span>Subtotal</span><b id="subtotalCart">R$ 0,00</b></div>
<button id="btnIrPag" style="background:#111;color:#fff;width:100%;padding:14px;border:none;border-radius:12px;font-weight:700" onclick="mostrarPagamento()">ESCOLHER PAGAMENTO</button>
<button id="btnFinal" style="display:none;background:#e84393;color:#fff;width:100%;padding:14px;border:none;border-radius:12px;font-weight:700" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
</div>
</div>

<div id="cartBtn" onclick="abrirCarrinho()">🛒 Carrinho R$ <span id="tot">0.00</span></div>

<script>
let car=[], tamSel='P', paySel='';
function getConf(){try{return JSON.parse(localStorage.getItem('bonitas_conf'))||{taxa:10,zap:'558399923260',pix:'66b5d5fe-b9af-4d26-9f27-2467300dc6e3',pixNome:'BONITAS'}}catch{return{taxa:10,zap:'558399923260',pix:'66b5d5fe-b9af-4d26-9f27-2467300dc6e3'}}}
function getCategorias(){return JSON.parse(localStorage.getItem('bonitas_categorias')||'[]')}
function setTam(el,t){document.querySelectorAll('.tam button').forEach(b=>b.classList.remove('ativo'));el.classList.add('ativo');tamSel=t;render()}
function getProds(){return JSON.parse(localStorage.getItem('bonitas_produtos')||'[]')}
function renderFiltros(){let cats=getCategorias();document.getElementById('filtroCats').innerHTML=cats.length?cats.map(c=>`<label style="font-size:13px;display:block;margin:6px 0"><input type="checkbox" class="fcat" value="${c}" checked onchange="render()"> ${c}</label>`).join(''):'<small style="color:#999">Nenhuma categoria criada no admin ainda</small>'}
function render(){
 let lista=getProds();let busca=document.getElementById('busca').value.toLowerCase();
 let cats=[...document.querySelectorAll('.fcat:checked')].map(c=>c.value);
 let pmax=Number(document.getElementById('pmax').value);
 lista=lista.filter(p=>{
  if(busca &&!p.nome.toLowerCase().includes(busca)) return false;
  if(cats.length &&!cats.includes(p.cat)) return false;
  if(Number(p.preco)>pmax) return false;
  return true;
 });
 let grid=document.getElementById('grid');
 if(!lista.length){grid.innerHTML=`<div class="vazio"><div style="font-size:48px">🛍️</div><h3>Nenhum produto</h3><p>Crie categorias em /admin > 📂 Categorias e adicione produtos</p></div>`;return}
 grid.innerHTML=lista.map(p=>`<div class="card"><div style="position:relative"><img src="${p.foto}" onerror="this.src='https://via.placeholder.com/400x500?text=BONITAS'"><span style="position:absolute;top:10px;right:10px;background:#ffd1dc;color:#8a1740;font-size:10px;padding:4px 8px;border-radius:10px;font-weight:700">${p.cat||''}</span></div><div class="info"><div><b style="font-size:13px">${p.nome}</b><br><span class="preco">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</span></div><button class="add" onclick='add(${JSON.stringify(p).replace(/'/g,"&#39;")})'>+</button></div></div>`).join('');
}
function add(p){let o=typeof p==='string'?JSON.parse(p):p;let ex=car.find(x=>x.id===o.id && x.tam===tamSel);if(ex){ex.qtd++}else{car.push({...o,tam:tamSel,cor:(o.cores||'Rosa').split(',')[0],qtd:1})}atualizarCarrinho();abrirCarrinho()}
function abrirCarrinho(){document.getElementById('carrinhoModal').classList.add('aberto')}
function fecharCarrinho(){document.getElementById('carrinhoModal').classList.remove('aberto')}
function atualizarCarrinho(){
 document.getElementById('qtd').innerText=car.reduce((a,b)=>a+b.qtd,0);
 let sub=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0);
 document.getElementById('subtotalCart').innerText='R$ '+sub.toFixed(2).replace('.',',');
 document.getElementById('tot').innerText=(sub+Number(getConf().taxa||0)).toFixed(2);
 let div=document.getElementById('itensCarrinho');
 if(!car.length){div.innerHTML='<p style="padding:40px;text-align:center;color:#999">Carrinho vazio</p>';return}
 div.innerHTML=car.map((p,i)=>`<div class="carrinhoItem"><img src="${p.foto}"><div style="flex:1"><b style="font-size:13px;text-transform:uppercase">${p.nome}</b><br><small>${p.tam} • ${p.cor}</small><br><b>R$ ${Number(p.preco).toFixed(2).replace('.',',')}</b><div style="display:flex;gap:8px;margin-top:6px"><button class="qtdBtn" onclick="altQtd(${i},-1)">−</button><span>${p.qtd}</span><button class="qtdBtn" onclick="altQtd(${i},1)">+</button></div></div><button onclick="remItem(${i})" style="background:none;border:none;color:#e84393">✕</button></div>`).join('');
}
function altQtd(i,d){car[i].qtd+=d;if(car[i].qtd<=0)car.splice(i,1);atualizarCarrinho()}
function remItem(i){car.splice(i,1);atualizarCarrinho()}
function mostrarPagamento(){if(!car.length)return alert('Carrinho vazio');document.getElementById('pagamentos').style.display='block';document.getElementById('btnIrPag').style.display='none';document.getElementById('btnFinal').style.display='block'}
function selPay(el,tipo){document.querySelectorAll('.payOpt').forEach(o=>o.classList.remove('ativo'));el.classList.add('ativo');paySel=tipo;let sub=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0)+Number(getConf().taxa||0);document.getElementById('pixArea').style.display='none';document.getElementById('parcelaInfo').style.display='none';if(tipo==='pix'){let c=getConf();document.getElementById('pixArea').style.display='block';document.getElementById('pixChaveTxt').innerText=c.pix;document.getElementById('pixTotal').innerText='Total: R$ '+sub.toFixed(2).replace('.',',');document.getElementById('pixQr').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(c.pix+' '+sub)}`}if(tipo==='credito'){document.getElementById('parcelaInfo').style.display='block';document.getElementById('parcelaInfo').innerHTML=`💳 3x de R$ ${(sub/3).toFixed(2).replace('.',',')} sem juros<br>Total R$ ${sub.toFixed(2).replace('.',',')}`}if(tipo==='debito'){document.getElementById('parcelaInfo').style.display='block';document.getElementById('parcelaInfo').innerHTML=`À vista no débito - R$ ${sub.toFixed(2).replace('.',',')}`}}
function finalizarPedido(){if(!paySel)return alert('Escolha pagamento');let c=getConf();let sub=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0);let total=sub+Number(c.taxa||0);let pag={dinheiro:'Dinheiro',credito:`Crédito 3x ${(total/3).toFixed(2)} sem juros`,debito:'Débito à vista',pix:`PIX ${c.pix}`}[paySel];let msg=`Olá BONITAS! Pedido:%0A${car.map(x=>`- ${x.nome} ${x.tam}/${x.cor} x${x.qtd} R$ ${x.preco}`).join('%0A')}%0ATotal R$ ${total.toFixed(2)}%0APagamento: ${pag}`;window.open(`https://wa.me/${c.zap}?text=${msg}`,'_blank');car=[];atualizarCarrinho();fecharCarrinho()}
renderFiltros();render();window.addEventListener('storage',()=>{renderFiltros();render()});
</script>
</body></html>
