<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BONITAS | Feito para você</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;font-family:Inter}
body{background:#fff5f7}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:14px 26px;box-shadow:0 2px 20px #0001}
header b{font-family:Playfair Display;color:#8a1740;letter-spacing:3px;font-size:24px}
#hero{position:relative;height:460px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#fff5f7 0%,#fff5f7cc 30%,#8a174055 100%)}
#hero .content{position:relative;z-index:2}
#hero h1{font-family:Playfair Display;font-size:72px;color:#8a1740;line-height:.9}
#hero p{letter-spacing:6px;color:#8a1740;font-weight:700;margin-top:8px;font-size:12px}
.buscaWrap{margin:22px auto 0;background:#fff;border-radius:40px;display:flex;align-items:center;padding:6px 6px 6px 18px;box-shadow:0 10px 30px #0001;max-width:520px}
.buscaWrap input{flex:1;border:none;outline:none}
.buscaWrap button{background:#e84393;color:#fff;border:none;padding:10px 22px;border-radius:30px;font-weight:700;cursor:pointer}
.layout{max-width:1300px;margin:0 auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:22px}
.filtros{background:#fff;border-radius:20px;padding:18px;border:1px solid #f5d6e0;position:sticky;top:90px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #f3d6e0;box-shadow:0 8px 20px #0001;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px)}
.card .imgBox{position:relative;background:#fff;width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .imgBox img{width:100%;height:100%;object-fit:contain;object-position:center top;background:#fff}
.tag{position:absolute;top:12px;right:12px;background:#ffd1dc;color:#8a1740;font-size:10px;padding:5px 10px;border-radius:20px;font-weight:700}
.cardInfo{padding:12px 14px;display:flex;justify-content:space-between;align-items:end}
.preco{color:#8a1740;font-weight:800;font-size:15px}
.add{background:#e84393;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 4px 12px #e8439340}
.tam button{padding:8px;border:1px solid #f0c6d3;background:#f9f0f3;border-radius:10px;cursor:pointer}
.tam button.ativo{background:#fde2ea;border-color:#e84393;color:#8a1740;font-weight:700}
#sobreLoja{max-width:1300px;margin:50px auto;padding:50px 24px;background:url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1200') center/cover;border-radius:28px;position:relative;overflow:hidden}
#sobreLoja::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#fff 40%,#ffffffcc)}
#sobreLoja>div{position:relative;z-index:2;max-width:560px}
#sobreLoja h2{font-family:Playfair Display;font-size:42px;color:#8a1740}

/* CARRINHO CONSERTADO */
#carrinhoModal{position:fixed;right:0;top:0;width:410px;max-width:100vw;height:100dvh;background:#fff;z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:.3s;box-shadow:-20px 0 60px #0002}
#carrinhoModal.aberto{transform:translateX(0)}
#itensCarrinho{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.carrinhoFooter{flex-shrink:0;background:#fff;border-top:2px solid #e84393;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.payOpt{border:1.5px solid #f0c6d3;padding:12px 14px;border-radius:14px;margin:7px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.payOpt.ativo{border-color:#e84393;background:#fff0f5}
.parcelas{display:flex;gap:8px;margin-top:10px}
.parcelas button{flex:1;padding:10px;border:1px solid #f0c6d3;border-radius:10px;background:#fff;cursor:pointer;font-weight:700}
.parcelas button.ativo{background:#e84393;color:#fff;border-color:#e84393}
#btnFinal{position:sticky;bottom:0;background:#e84393!important;color:#fff;width:100%;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:17px;box-shadow:0 10px 30px #e8439355;z-index:10}

#detalheModal{position:fixed;inset:0;background:#0007;z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#detalheModal.aberto{display:flex}
.detalheCard{background:#fff;border-radius:24px;max-width:950px;width:100%;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;max-height:90vh}
.detalheCard img{width:100%;height:100%;object-fit:contain;background:#fff;max-height:80vh}
.vazio{grid-column:1/-1;text-align:center;padding:80px;background:#fff;border-radius:20px;border:1px dashed #e84393;color:#999}
#cartBtn{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:15px 24px;border-radius:40px;font-weight:800;cursor:pointer;z-index:60;box-shadow:0 10px 30px #0003}
#whatsFloat{position:fixed;left:18px;bottom:18px;width:58px;height:58px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px #25d36666;z-index:70;text-decoration:none;font-size:28px}
@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}#hero h1{font-size:44px}.detalheCard{grid-template-columns:1fr}#carrinhoModal{width:100vw}.filtros{position:relative;top:0}.carrinhoFooter{max-height:68vh}}
</style>
</head><body>
<header><b>BONITAS</b><div style="display:flex;gap:18px;align-items:center"><a onclick="document.getElementById('produtosAncora').scrollIntoView({behavior:'smooth'})" style="cursor:pointer;font-weight:700;color:#8a1740">Loja</a><a href="/admin?v=12" style="color:#e84393;font-weight:800;text-decoration:none;font-size:12px">Admin</a><span onclick="abrirCarrinho()" style="cursor:pointer">🛒 <b id="qtd">0</b></span></div></header>

<div id="hero">
<img class="bg" src="https://images.unsplash.com/photo-1469334031218-e382a71b
