<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BONITAS | Moda Feminina</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--pink:#FF13B5;--pink2:#FFF0F7}*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}body{background:#fff}header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eee;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:'Playfair Display';color:var(--pink);font-size:22px;letter-spacing:2px}.cart-btn{border:none;background:none;font-size:20px;position:relative;cursor:pointer}.cart-count{position:absolute;top:-8px;right:-8px;background:var(--pink);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:420px}.hero-left{padding:50px 40px}.hero-left h1{font-family:'Playfair Display';font-size:48px;line-height:1}.btn-pink{background:var(--pink);color:#fff;border:none;padding:12px 22px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:16px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px}.card{border:1px solid #eee;border-radius:16px;overflow:hidden}.card img{width:100%;height:300px;object-fit:cover}.card-body{padding:12px}.price{color:var(--pink);font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100;overflow:auto}.modal.active{display:flex;justify-content:center;padding:20px}.modal-content{background:#fff;border-radius:18px;max-width:800px;width:100%;padding:20px;position:relative;margin-top:20px}.close{position:absolute;top:10px;right:14px;cursor:pointer}.cart-drawer{position:fixed;top:0;right:-400px;width:360px;height:100%;background:#fff;z-index:110;transition:.3s;padding:16px;display:flex;flex-direction:column}.cart-drawer.open{right:0}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:109}.overlay.show{display:block}.qr-box{text-align:center;padding:16px;background:#fff0f7;border-radius:12px;margin-top:12px}#qrcode{display:flex;justify-content:center;margin:10px 0}.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkout-grid input,.checkout-grid select{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%}.full{grid-column:1/-1}</style></head><body>
<header><div class="logo">BONITAS</div><nav style="font-size:12px"><a href="#">Loja</a> | <a href="/admin/">Admin</a></nav><button class="cart-btn" onclick="toggleCart()">🛒<span class="cart-count" id="cartCount">0</span></button></header>
<section class="hero"><div class="hero-left"><span style="color:var(--pink);font-size:11px;letter-spacing:3px">NOVA COLEÇÃO</span><h1>Looks feitos<br>para você.</h1><p style="color:#666;font-size:13px;margin-top:8px">Estilo e tendência em João Pessoa - PB</p><button class="btn-pink">VER COLEÇÃO</button></div><div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:24px 0 0 24px"></div></section>
<div class="products" id="products"></div>
<div class="overlay" id="overlay" onclick="toggleCart()"></div><div class="cart-drawer" id="cartDrawer"><div style="display:flex;justify-content:space-between"><h3>Carrinho</h3><span class="close" onclick="toggleCart()">x</span></div><div id="cartItems" style="flex:1;overflow:auto;margin:12px 0"></div><div><div style="display:flex;justify-content:space-between"><span>Subtotal</span><b id="cartTotal">R$ 0,00</b></div><button class="btn-pink" style="width:100%;margin-top:10px" onclick="openCheckout()">FINALIZAR</button></div></div>
<div class="modal" id="checkoutModal"><div class="modal-content"><span class="close" onclick="closeModal('checkoutModal')">x</span><h2>Finalizar pedido</h2><div class="checkout-grid" style="margin-top:12px"><input id="cNome" class="full" placeholder="Nome completo *"><input id="cZap" placeholder="WhatsApp *"><input id="cCep" placeholder="CEP * - busca automático" onblur="buscarCep()" maxlength="9"><button onclick="buscarCep()" style="padding:10px;border:1px solid var(--pink);background:#fff;color:var(--pink);border-radius:8px">Buscar CEP</button><input id="cRua" placeholder="Rua" class="full"><input id="cNum" placeholder="Número"><input id="cBairro" placeholder="Bairro"><input id="cCid" placeholder="Cidade"><input id="cEst" placeholder="Estado"><div class="full"><label>Pagamento *</label><br><label><input type="radio" name="pag" value="pix" checked onchange="togglePag()"> PIX 5% OFF + QR Code</label> <label><input type="radio" name="pag" value="credito" onchange="togglePag()"> Cartão 3x sem juros</label></div><div id="pixArea" class="full"><div class="qr-box"><b>PIX - Chave: 66b5d5fe-b9af-4d26-9f27-2467300dc6e3</b><p id="pixCopia" style="font-size:10px;word-break:break-all"></p><div id="qrcode"></div><div id="pixValor" style="font-size:12px"></div><button onclick="copyPix()" style="margin-top:6px;padding:6px 12px;border:1px solid var(--pink);background:#fff;color:var(--pink);border-radius:20px">Copiar PIX</button></div></div><div id="creditoArea" class="full" style="display:none"><div style="background:#f5f5f5;padding:10px;border-radius:8px;font-size:12px" id="parcelasInfo"></div><select id="parcelSelect" style="margin-top:8px"><option>1x sem juros</option><option>2x sem juros</option><option selected>3x sem juros</option></select></div><p id="cepStatus" style="color:var(--pink);font-size:11px" class="full"></p><button class="btn-pink full" style="margin-top:10px" onclick="finalizarWhats()">ENVIAR NO WHATSAPP</button></div></div></div>
<script>
const PIX_KEY="66b5d5fe-b9af-4d26-9f27-2467300dc6e3";const MERCHANT="BONITAS";const CITY="JOAO PESSOA";let products=[{id:1,nome:"BLUSA VERÃO",cat:"Blusa",preco:49.9,img:"https://i.imgur.com/8QJ4sQv.jpeg",desc:"BLUSA EM POLIAMIDA 100% FORRADA"},{id:2,nome:"VESTIDO FLORAL",cat:"Vestido",preco:129.9,img:"https://i.imgur.com/Q7p8uGp.jpeg",desc:"Vestido longo"},{id:3,nome:"CONJUNTO LUXO",cat:"Conjunto",preco:189.9,img:"https://i.imgur.com/8QJ4sQv.jpeg",desc:"Conjunto premium"}];let cart=[];
function formatBRL(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function renderProducts(){let h="";products.forEach(p=>{h+=`<div class="card"><img src="${p.img}"><div class="card-body"><small>${p.cat}</small><h3 style="font-family:'Playfair Display'">${p.nome}</h3><div class="price">${formatBRL(p.preco)}</div><div style="font-size:11px;color:#666">${formatBRL(p.preco/3)} em 3x sem juros</div><button class="btn-pink" style="width:100%;margin-top:8px" onclick="addToCart(${p.id})">COMPRAR</button></div></div>`});document.getElementById('products').innerHTML=h}
function addToCart(id){let p=products.find(x=>x.id===id);cart.push({...p,qty:1,total:p.preco});updateCart();toggleCart()}
function updateCart(){document.getElementById('cartCount').innerText=cart.length;let html="";let sub=0;cart.forEach((i,idx)=>{sub+=i.total;html+=`<div style="display:flex;gap:8px;margin-bottom:8px"><img src="${i.img}" style="width:50px;height:50px;border-radius:6px"><div><b style="font-size:12px">${i.nome}</b><br><span style="color:var(--pink)">${formatBRL(i.preco)}</span> <span onclick="cart.splice(${idx},1);updateCart()" style="color:red;cursor:pointer">x</span></div></div>`});document.getElementById('cartItems').innerHTML=html||"Vazio";document.getElementById('cartTotal').innerText=formatBRL(sub);genPix(sub)}
function toggleCart(){document.getElementById('cartDrawer').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function closeModal(id){document.getElementById(id).classList.remove('active')}
function openCheckout(){if(cart.length===0){alert('Carrinho vazio');return}document.getElementById('cartDrawer').classList.remove('open');document.getElementById('overlay').classList.remove('show');document.getElementById('checkoutModal').classList.add('active')}
function togglePag(){let p=document.querySelector('input[name="pag"]:checked').value;document.getElementById('pixArea').style.display=p==='pix'?'block':'none';document.getElementById('creditoArea').style.display=p==='credito'?'block':'none'}
function buscarCep(){let cep=document.getElementById('cCep').value.replace(/\D/g,'');if(cep.length!==8){document.getElementById('cepStatus').innerText='CEP inválido';return}document.getElementById('cepStatus').innerText='Buscando...';fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r=>r.json()).then(d=>{if(d.erro){document.getElementById('cepStatus').innerText='CEP não encontrado';return}document.getElementById('cRua').value=d.logradouro;document.getElementById('cBairro').value=d.bairro;document.getElementById('cCid').value=d.localidade;document.getElementById('cEst').value=d.uf;document.getElementById('cepStatus').innerText=`✅ ${d.logradouro}, ${d.bairro} - ${d.localidade}/${d.uf}`})}
function genPix(valor){let v=valor;let pag=document.querySelector('input[name="pag"]:checked')?.value;if(pag==='pix')v=v*0.95;if(v<=0)v=0.01;let amount=v.toFixed(2);let payload=`00020126580014BR.GOV.BCB.PIX0136${PIX_KEY}520400005303986540${amount.length.toString().padStart(2,'0')}${amount}5802BR5913${MERCHANT.padEnd(13,' ')}6008${CITY.substring(0,8)}62070503***6304`;function crc16(str){let crc=0xFFFF;for(let c=0;c<str.length;c++){crc^=str.charCodeAt(c)<<8;for(let i=0;i<8;i++){if(crc&0x8000)crc=(crc<<1)^0x1021;else crc<<=1;crc&=0xFFFF} }return crc.toString(16).toUpperCase().padStart(4,'0')}let full=payload+crc16(payload);document.getElementById('pixCopia').innerText=full;document.getElementById('pixValor').innerText=`Valor: ${formatBRL(v)} | 3x de ${formatBRL(v/3)} sem juros`;document.getElementById('qrcode').innerHTML="";new QRCode(document.getElementById('qrcode'),{text:full,width:160,height:160});document.getElementById('parcelasInfo').innerHTML=`Total ${formatBRL(v)}<br>1x ${formatBRL(v)}<br>2x ${formatBRL(v/2)}<br>3x ${formatBRL(v/3)} sem juros`}
function copyPix(){navigator.clipboard.writeText(document.getElementById('pixCopia').innerText);alert('PIX copiado!')}
function finalizarWhats(){let sub=cart.reduce((s,i)=>s+i.total,0);let pag=document.querySelector('input[name="pag"]:checked').value;if(pag==='pix')sub*=0.95;let msg=`Olá BONITAS! Quero:%0A`;cart.forEach(i=>{msg+=`- ${i.nome} ${formatBRL(i.total)}%0A`});msg+=`Total ${formatBRL(sub)} - 3x ${formatBRL(sub/3)} s/ juros%0A`;msg+=`Nome: ${document.getElementById('cNome').value}%0A`;msg+=`CEP: ${document.getElementById('cCep').value} ${document.getElementById('cRua').value}%0A`;msg+=`PIX: ${document.getElementById('pixCopia').innerText}`;window.open(`https://wa.me/558399923260?text=${msg}`,'_blank')}
renderProducts();
</script></body></html>
