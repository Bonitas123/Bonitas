<script>
let car=[], tamSel='P', paySel='', parcSel=3, prodSel=null, corSel='Rosa';
function getConf(){
  let c = JSON.parse(localStorage.getItem('bonitas_conf')||'null');
  // SE NÃO TEM CONFIG, USA SUA CHAVE FIXA
  if(!c || !c.pix) return {taxa:10, zap:'558399923260', pix:'66b5d5fe-b9af-4d26-9f27-2467300dc6e3', pixNome:'BONITAS'};
  return c;
}
function getCategorias(){return JSON.parse(localStorage.getItem('bonitas_categorias')||'[]')}
function getProds(){return JSON.parse(localStorage.getItem('bonitas_produtos')||'[]')}
function setTam(el,t){document.querySelectorAll('.tam button').forEach(b=>{b.classList.remove('ativo')});if(el)el.classList.add('ativo');tamSel=t;render()}
function renderFiltros(){let cats=getCategorias();document.getElementById('filtroCats').innerHTML=cats.length?cats.map(c=>`<label style="display:block;margin:6px 0;font-size:13px"><input type="checkbox" class="fcat" value="${c}" checked onchange="render()"> ${c}</label>`).join(''):'<small style="color:#999">Nenhuma categoria no admin<br>Crie em /admin > Categorias</small>'}
function render(){
 let lista=getProds();let busca=document.getElementById('busca').value.toLowerCase();
 let cats=[...document.querySelectorAll('.fcat:checked')].map(c=>c.value);
 let pmax=Number(document.getElementById('pmax').value);
 lista=lista.filter(p=>{if(busca &&!p.nome.toLowerCase().includes(busca))return false;if(cats.length &&!cats.includes(p.cat))return false;if(Number(p.preco)>pmax)return false;return true});
 let grid=document.getElementById('grid');
 if(!lista.length){grid.innerHTML=`<div class="vazio"><div style="font-size:48px">🛍️</div><h3>Nenhum produto nessa categoria</h3></div>`;return}
 grid.innerHTML=lista.map(p=>`<div class="card" onclick='openDetalhe(${JSON.stringify(p).replace(/'/g,"&#39;")})'><div class="imgBox"><img src="${p.foto}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x500?text=BONITAS'"><span class="tag">${p.cat||'BONITAS'}</span></div><div class="cardInfo"><div><b style="font-size:12px;text-transform:uppercase">${p.nome}</b><br><span class="preco">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</span><br><small style="color:#888">${p.cores||'Única'}</small></div><button class="add" onclick="event.stopPropagation();add(${JSON.stringify(p).replace(/'/g,"&#39;")})">+</button></div></div>`).join('');
}
function openDetalhe(p){prodSel=typeof p==='string'?JSON.parse(p):p;document.getElementById('detImg').src=prodSel.foto;document.getElementById('detNome').innerText=prodSel.nome;document.getElementById('detCat').innerText=prodSel.cat;document.getElementById('detPreco').innerText='R$ '+Number(prodSel.preco).toFixed(2).replace('.',',');let cores=(prodSel.cores||'Rosa,Branco').split(',');document.getElementById('detTams').innerHTML=['PP','P','M','G','GG'].map(t=>`<button onclick="tamSel='${t}';this.parentElement.querySelectorAll('button').forEach(b=>b.style.background='#fff');this.style.background='#fde2ea'" style="padding:8px 14px;border:1px solid #eee;border-radius:10px;background:#fff;cursor:pointer">${t}</button>`).join('');document.getElementById('detCores').innerHTML=cores.map(c=>`<button onclick="corSel='${c.trim()}'" style="padding:8px 14px;border:1px solid #eee;border-radius:20px;background:#fff;cursor:pointer">${c.trim()}</button>`).join('');document.getElementById('detalheModal').classList.add('aberto')}
function fecharDetalhe(){document.getElementById('detalheModal').classList.remove('aberto')}
function addDoDetalhe(){add(prodSel);fecharDetalhe()}
function add(p){let o=typeof p==='string'?JSON.parse(p):p;let ex=car.find(x=>x.id===o.id && x.tam===tamSel);if(ex)ex.qtd++;else car.push({...o,tam:tamSel,cor:corSel,qtd:1});atualizarCarrinho();abrirCarrinho()}
function abrirCarrinho(){document.getElementById('carrinhoModal').classList.add('aberto')}
function fecharCarrinho(){document.getElementById('carrinhoModal').classList.remove('aberto')}
function atualizarCarrinho(){
 document.getElementById('qtd').innerText=car.reduce((a,b)=>a+b.qtd,0);
 let sub=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0);
 let taxa=Number(getConf().taxa||10);
 document.getElementById('subtotalCart').innerText='R$ '+sub.toFixed(2).replace('.',',');
 document.getElementById('tot').innerText=(sub+taxa).toFixed(2);
 let div=document.getElementById('itensCarrinho');
 if(!car.length){div.innerHTML='<p style="padding:50px;text-align:center;color:#999">Carrinho vazio</p>';return}
 div.innerHTML=car.map((p,i)=>`<div class="carrinhoItem"><img src="${p.foto}" style="width:62px;height:62px;border-radius:12px;object-fit:contain;background:#fff"><div style="flex:1"><b style="font-size:12px;text-transform:uppercase">${p.nome}</b><br><small>${p.tam} • ${p.cor}</small><br><b>R$ ${Number(p.preco).toFixed(2).replace('.',',')}</b><div style="display:flex;gap:8px;margin-top:6px"><button onclick="altQtd(${i},-1)" style="width:26px;height:26px;border:1px solid #eee;border-radius:8px;background:#fff;cursor:pointer">−</button><span>${p.qtd}</span><button onclick="altQtd(${i},1)" style="width:26px;height:26px;border:1px solid #eee;border-radius:8px;background:#fff;cursor:pointer">+</button></div></div><button onclick="remItem(${i})" style="background:none;border:none;color:#e84393;cursor:pointer">✕</button></div>`).join('');
 if(paySel==='credito') atualizarParcelas();
}
function altQtd(i,d){car[i].qtd+=d;if(car[i].qtd<=0)car.splice(i,1);atualizarCarrinho()}
function remItem(i){car.splice(i,1);atualizarCarrinho()}
function mostrarPagamento(){if(!car.length)return alert('Carrinho vazio');document.getElementById('pagamentos').style.display='block';document.getElementById('btnIrPag').style.display='none';document.getElementById('btnFinal').style.display='block'}
function selPay(el,tipo){
 document.querySelectorAll('.payOpt').forEach(o=>o.classList.remove('ativo'));el.classList.add('ativo');paySel=tipo;
 document.getElementById('pixArea').style.display='none';document.getElementById('parcelaBox').style.display='none';
 let conf=getConf();let total=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0)+Number(conf.taxa||10);
 if(tipo==='pix'){
   document.getElementById('pixArea').style.display='block';
   document.getElementById('pixChaveTxt').innerText=conf.pix;
   document.getElementById('pixTotal').innerText='Total: R$ '+total.toFixed(2).replace('.',',');
   document.getElementById('pixQr').src=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(conf.pix)}`;
 }
 if(tipo==='credito'){document.getElementById('parcelaBox').style.display='block';atualizarParcelas()}
}
function setParc(n){parcSel=n;document.querySelectorAll('.parcelas button').forEach(b=>b.classList.remove('ativo'));document.getElementById('parc'+n).classList.add('ativo');atualizarParcelas()}
function atualizarParcelas(){
 let conf=getConf();let total=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0)+Number(conf.taxa||10);
 let info=document.getElementById('parcelaInfo');info.style.display='block';
 info.innerHTML=`💳 <b>${parcSel}x de R$ ${(total/parcSel).toFixed(2).replace('.',',')} sem juros</b><br>Total R$ ${total.toFixed(2).replace('.',',')}`;
}
function finalizarPedido(){
 if(!paySel)return alert('Escolha a forma de pagamento');
 let conf=getConf();let sub=car.reduce((a,b)=>a+Number(b.preco)*b.qtd,0);let total=sub+Number(conf.taxa||10);
 let pagTxt=paySel==='credito'?`Crédito ${parcSel}x sem juros`:paySel==='pix'?`PIX ${conf.pix}`:paySel;
 let msg=`Olá BONITAS! 🛍️%0A${car.map(x=>`- ${x.nome} ${x.tam}/${x.cor} x${x.qtd} R$ ${x.preco}`).join('%0A')}%0A%0ATotal R$ ${total.toFixed(2)}%0APagamento: ${pagTxt}`;
 window.open(`https://wa.me/${conf.zap}?text=${msg}`,'_blank');car=[];atualizarCarrinho();fecharCarrinho();
}
renderFiltros();render();
</script>
