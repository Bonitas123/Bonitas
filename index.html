<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BONITAS | Moda Feminina</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;font-family:Inter}body{background:#fff}header{padding:16px;display:flex;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #f0d6de}header h1{font-family:Playfair Display;color:#e84393;letter-spacing:4px}.produtos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px}.cardProd{border:1px solid #f0d6de;border-radius:14px;overflow:hidden;background:white}.cardProd img{width:100%;height:200px;object-fit:cover}.cardProd div{padding:10px}.btn{background:#e84393;color:white;border:none;padding:10px;border-radius:10px;width:100%;font-weight:700;cursor:pointer}#carrinho{position:fixed;right:10px;bottom:10px;background:#111;color:white;padding:14px 20px;border-radius:30px;font-weight:700;cursor:pointer;z-index:99}</style>
</head>
<body>
<header><h1>BONITAS</h1><a href="/admin/" style="text-decoration:none;color:#e84393;font-weight:700">ADMIN</a></header>

<div id="listaProdutos" class="produtos"></div>

<div id="carrinho" onclick="abrirCarrinho()">🛒 <span id="qtd">0</span> | R$ <span id="total">0.00</span></div>

<div id="modalCar" style="display:none;position:fixed;inset:0;background:#0008;z-index:999;align-items:center;justify-content:center"><div style="background:white;width:95%;max-width:400px;padding:20px;border-radius:18px"><h3>Seu Carrinho</h3><div id="itens" style="margin:14px 0"></div><input id="nomeCli" placeholder="Seu nome"><input id="telCli" placeholder="Seu WhatsApp" style="margin-top:8px"><button class="btn" style="margin-top:10px;background:#25D366" onclick="finalizar()">Finalizar no WhatsApp</button><button onclick="document.getElementById('modalCar').style.display='none'" style="width:100%;margin-top:8px;border:none;background:#eee;padding:10px;border-radius:10px">Fechar</button></div></div>

<script>
let car=[];
function getConf(){try{return JSON.parse(localStorage.getItem('bonitas_conf')||'{}')}catch{return {}}}
function getTaxa(){return Number(getConf().taxa||10)}

function carregar(){
 const produtos = JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');
 const div = document.getElementById('listaProdutos');
 if(produtos.length===0){
   div.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999"><h3>Nenhum produto cadastrado</h3><p>Vá em /admin/ > Produtos > Novo produto</p></div>';return
 }
 div.innerHTML=produtos.filter(p=>p.ativo!==false).map((p,i)=>`
   <div class="cardProd">
     <img src="${p.foto}">
     <div><b>${p.nome}</b><br><small style="color:#666">${p.cat||''}</small><br><b style="color:#e84393">R$ ${Number(p.preco).toFixed(2)}</b><br><button class="btn" style="margin-top:8px" onclick="add(${i})">Adicionar</button></div>
   </div>
 `).join('');
}

function add(i){
 const produtos = JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');
 car.push(produtos[i]);
 atualiza();
}
function atualiza(){
 document.getElementById('qtd').innerText=car.length;
 let taxa=getTaxa();
 let sub=car.reduce((a,b)=>a+Number(b.preco),0);
 let tot=sub+ (car.length?taxa:0);
 document.getElementById('total').innerText=tot.toFixed(2);
 document.getElementById('itens').innerHTML=car.map(c=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0"><span>${c.nome}</span><b>R$ ${c.preco}</b></div>`).join('')+ (car.length?`<div style="display:flex;justify-content:space-between;padding:6px 0;color:#666"><span>Entrega</span><span>R$ ${taxa.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between;font-weight:800"><span>Total</span><span>R$ ${tot.toFixed(2)}</span></div>`:'');
}
function abrirCarrinho(){document.getElementById('modalCar').style.display='flex';atualiza()}
function finalizar(){
 const nome=document.getElementById('nomeCli').value||'Cliente';
 const tel=document.getElementById('telCli').value||'';
 if(car.length===0) return alert('Carrinho vazio');
 const taxa=getTaxa();
 const sub=car.reduce((a,b)=>a+Number(b.preco),0);
 const total=sub+taxa;
 const zap=getConf().zap||'558399923260';
 let msg=`Olá BONITAS! Sou ${nome}%0AQuero:%0A${car.map(c=>`- ${c.nome} R$ ${c.preco}`).join('%0A')}%0AEntrega: R$ ${taxa.toFixed(2)}%0ATotal: R$ ${total.toFixed(2)}`;
 // SALVA NOS PEDIDOS DO ADMIN
 let pedidos=JSON.parse(localStorage.getItem('bonitas_pedidos')||'[]');
 pedidos.push({nome,tel:tel, itens:car.map(c=>c.nome).join(', '), total:total.toFixed(2), pago:false, data:new Date().toLocaleString()});
 localStorage.setItem('bonitas_pedidos',JSON.stringify(pedidos));
 window.open(`https://wa.me/${zap}?text=${msg}`,'_blank');
 car=[];atualiza();document.getElementById('modalCar').style.display='none';
}
carregar();
</script>
</body>
</html>
