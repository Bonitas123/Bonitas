<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BONITAS | Feito para você</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;font-family:Inter}body{background:#fdfafb}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid #f2d6de;position:sticky;top:0;z-index:20}
header b{font-family:Playfair Display;letter-spacing:4px}nav a{margin:0 10px;text-decoration:none;color:#333;font-size:14px}nav a:hover{color:#e84393}
.admin{border:1px solid #e84393;color:#e84393;padding:6px 16px;border-radius:20px;text-decoration:none;font-size:13px}
.top{max-width:1250px;margin:0 auto;padding:28px 24px 0}
.top small{color:#e84393;letter-spacing:3px;font-weight:700}
.top h1{font-family:Playfair Display;font-size:42px;margin-top:6px}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.bar input{flex:1;padding:12px 14px;border:1px solid #f0d6de;border-radius:12px}
.bar select{padding:12px;border-radius:12px;border:1px solid #ddd}
.wrap{max-width:1250px;margin:0 auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:24px}
.filtros h3{margin-bottom:14px}.filtros label{font-size:13px;color:#666;margin-top:14px;display:block}
.filtros select,.filtros input[type=text]{width:100%;padding:10px;border:1px solid #f0d6de;border-radius:8px;margin-top:4px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid #f3dde3;border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px)}
.card img{width:100%;height:260px;object-fit:cover}
.card .info{padding:12px}.card b{font-size:14px}
.btn{background:#e84393;color:#fff;border:none;padding:10px;border-radius:10px;width:100%;font-weight:700;cursor:pointer;margin-top:8px}
.vazio{text-align:center;padding:80px 20px;color:#999}.vazio h3{color:#111;margin-top:10px}
#cart{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:14px 24px;border-radius:30px;font-weight:700;cursor:pointer;z-index:99;box-shadow:0 8px 20px #0003}
@media(max-width:800px){.wrap{grid-template-columns:1fr}#grid{grid-template-columns:repeat(2,1fr)}nav{display:none}}
</style>
</head>
<body>
<header><b>BONITAS</b><nav><a href="/">Início</a><a href="#loja">Loja</a><a href="#loja">Novidades</a><a href="#loja">Categorias</a><a href="admin/">Acompanhar pedido</a><a href="#">Sobre</a><a href="#">Contato</a></nav><a class="admin" href="admin/">Admin</a></header>

<div class="top" id="loja">
<small>FEITO PARA VOCÊ</small><h1>Nossa loja</h1>
<div class="bar"><input id="busca" placeholder="Busque por nome, categoria ou descrição..." oninput="filtrar()"><select><option>Mais recentes</option><option>Menor preço</option><option>Maior preço</option></select></div>
</div>

<div class="wrap">
<div class="filtros">
<h3>Filtros</h3>
<label>Categoria</label><select id="f-cat" onchange="filtrar()"><option value="">Todas</option><option>Croppeds</option><option>Vestidos</option><option>Blusas</option><option>Shorts</option></select>
<label>Preço máximo</label><b id="ptxt">R$ 300</b><input type="range" id="f-preco" min="20" max="300" value="300" oninput="document.getElementById('ptxt').innerText='R$ '+this.value;filtrar()" style="width:100%">
<label>Tamanho</label><select id="f-tam" onchange="filtrar()"><option value="">Todos</option><option>PP</option><option>P</option><option>M</option><option>G</option><option>GG</option></select>
<label>Cor</label><select id="f-cor" onchange="filtrar()"><option value="">Todas</option><option>Rosa</option><option>Branco</option><option>Preto</option><option>Azul</option></select>
<label><input type="checkbox" id="f-promo" onchange="filtrar()"> Em promoção</label>
<button onclick="limpar()" style="margin-top:16px;width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer">Limpar filtros</button>
</div>
<div><div id="grid"></div><div id="vazio" class="vazio" style="display:none"><div style="font-size:50px">🛍️</div><h3>Nenhum produto encontrado.</h3><p>Tente mudar a busca ou os filtros.</p></div></div>
</div>

<div id="cart" onclick="finalizar()">🛒 <span id="q">0</span> | R$ <span id="t">0.00</span></div>

<script>
let car=[], todos=[];
function getConf(){try{return JSON.parse(localStorage.getItem('bonitas_conf'))||{taxa:10,zap:'558399923260'}}catch{return{taxa:10,zap:'558399923260'}}}
function getTaxa(){return Number(getConf().taxa||10)}

function init(){
 let salvos=JSON.parse(localStorage.getItem('bonitas_produtos')||'[]');
 if(salvos.length===0){
  salvos=[
   {nome:'Cropped Rosa Canelado',cat:'Croppeds',preco:59.9,antigo:79.9,foto:'https://images.unsplash.com/photo-1550928431-ee0ec6db30d3?w=600',cores:'Rosa, Branco',tam:'P',promo:false,ativo:true,estoque:{'P/Rosa':5}},
   {nome:'Vestido Floral Verão',cat:'Vestidos',preco:129.9,foto:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600',cores:'Rosa',tam:'M',promo:true,ativo:true,estoque:{'M/Rosa':3}},
   {nome:'Blusa Branca Básica',cat:'Blusas',preco:49.9,foto:'https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=600',cores:'Branco',tam:'G',promo:false,ativo:true,estoque:{'G/Branco':10}},
   {nome:'Short Jeans Cintura Alta',cat:'Shorts',preco:89.9,foto:'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=600',cores:'Azul',tam:'M',promo:false,ativo:true,estoque:{'M/Azul':7}}
  ];
  localStorage.setItem('bonitas_produtos',JSON.stringify(salvos));
 }
 todos=salvos.filter(p=>p.ativo!==false);
 render(todos);
}
function render(lista){
 let g=document.getElementById('grid'), v=document.getElementById('vazio');
 if(!lista.length){g.innerHTML='';v.style.display='block';return}v.style.display='none';
 g.innerHTML=lista.map(p=>`
  <div class="card"><img src="${p.foto}" onerror="this.src='https://via.placeholder.com/300'"><div class="info"><small style="color:#888">${p.cat}</small><br><b>${p.nome}</b><br><div style="margin-top:4px"><b style="color:#e84393">R$ ${Number(p.preco).toFixed(2)}</b> ${p.antigo?`<small style="text-decoration:line-through;color:#999">R$ ${p.antigo}</small>`:''}</div><button class="btn" onclick='add(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Adicionar</button></div></div>
 `).join('');
}
function filtrar(){
 let b=document.getElementById('busca').value.toLowerCase();
 let cat=document.getElementById('f-cat').value, max=Number(document.getElementById('f-preco').value);
 let tam=document.getElementById('f-tam').value, cor=document.getElementById('f-cor').value, promo=document.getElementById('f-promo').checked;
 let f=todos.filter(p=>{
  if(b && !(`${p.nome} ${p.cat}`.toLowerCase().includes(b))) return false;
  if(cat && p.cat!==cat) return false;
  if(Number(p.preco)>max) return false;
  if(tam && !(p.tam||'').includes(tam)) return false;
  if(cor && !(p.cores||'').includes(cor)) return false;
  if(promo && !p.promo) return false;
  return true;
 });render(f);
}
function limpar(){document.getElementById('busca').value='';document.getElementById('f-cat').value='';document.getElementById('f-tam').value='';document.getElementById('f-cor').value='';document.getElementById('f-preco').value=300;document.getElementById('ptxt').innerText='R$ 300';document.getElementById('f-promo').checked=false;render(todos)}
function add(p){car.push(typeof p==='string'?JSON.parse(p):p);up()}
function up(){document.getElementById('q').innerText=car.length;let taxa=getTaxa();let sub=car.reduce((a,b)=>a+Number(b.preco),0);let tot=car.length?sub+taxa:0;document.getElementById('t').innerText=tot.toFixed(2)}
function finalizar(){
 if(!car.length) return alert('Carrinho vazio');
 let conf=getConf(), taxa=getTaxa(), sub=car.reduce((a,b)=>a+Number(b.preco),0), tot=sub+taxa;
 let pedidos=JSON.parse(localStorage.getItem('bonitas_pedidos')||'[]');
 pedidos.push({id:Date.now(),nome:'Cliente',itens:car.map(c=>c.nome).join(', '),total:tot.toFixed(2),taxa:taxa,pago:false,data:new Date().toLocaleString()});
 localStorage.setItem('bonitas_pedidos',JSON.stringify(pedidos));
 let msg=`Olá BONITAS!%0AQuero:%0A${car.map(c=>`- ${c.nome} R$ ${c.preco}`).join('%0A')}%0AEntrega: R$ ${taxa.toFixed(2)}%0ATotal: R$ ${tot.toFixed(2)}`;
 window.open(`https://wa.me/${conf.zap}?text=${msg}`,'_blank');car=[];up();
}
init();
</script>
</body>
</html>
